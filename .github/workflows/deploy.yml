name: Deploy

# Manual, after a merge to main. The runner holds a key that can do one thing
# on the host -- `deploy <sha>` (a forced command, ops/deploy.sh) -- and the
# host fetches that commit from this public repository itself, refuses it if
# it is not on main, and switches only once the new tree starts healthy.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to kurdishtts.dks.news
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kurdishtts.dks.news
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          KEY: ${{ secrets.KTTS_DEPLOY_KEY }}
          HOST_KEY: ${{ vars.KTTS_HOST_KEY }}
          HOST: ${{ vars.KTTS_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$HOST" "deploy $SHA" | tee out.txt
          grep -q "KTTS-DEPLOY-RESULT ok sha=$SHA" out.txt
      - name: Public health
        run: curl -sf https://kurdishtts.dks.news/api/tts/health

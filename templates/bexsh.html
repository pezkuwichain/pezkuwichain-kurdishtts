<!doctype html>
<html lang="kmr" dir="ltr">
<head>
{% include "_head.html" %}
<title>Dengê xwe bexşîne — KurdishTTS</title>
<meta name="description" content="Hevokên Kurdî bi dengê xwe bixwîne û dengê Kurdî yê pêşîn ê gelê Kurd ava bike. Donate your voice to the first Kurdish voice built by Kurds (CC0)." />
</head>
<body data-page="donate">
{% include "_header.html" %}
<main class="wrap">
  <section class="hero">
    <h1 data-t="dTitle">Dengê xwe bexşî zimanê xwe bike</h1>
    <p data-t="dLead"></p>
  </section>

  <section class="grid grid--3" aria-live="polite">
    {% for d in ['kmr', 'ckb'] %}
    <div class="card stat" data-stat="{{ d }}">
      <span data-t="{{ d }}"></span>
      <b><span data-k="h">0</span> <small class="note" data-t="hours"></small></b>
      <span><span data-k="v">0</span> <span data-t="validHours"></span> · <span data-k="s">0</span> <span data-t="speakers"></span></span>
      <div class="bar" title="50h"><i></i></div>
      <span class="note"><span data-t="goal"></span>: 50 h</span>
    </div>
    {% endfor %}
    <div class="card stat" id="me" hidden>
      <span data-t="mine"></span>
      <b data-k="c">0</b>
      <span><span data-k="m">0</span> <span data-t="minutes"></span> · <span data-k="v">0</span> <span data-t="votes"></span></span>
    </div>
  </section>

  <section class="card mt-18" id="gate">
    <p data-t="needSignIn" class="mt-0"></p>
    <button type="button" class="btn" id="gateBtn" data-t="signIn">Bi cuzdanê têkeve</button>
  </section>

  <section class="card mt-18" id="profile" data-consent="{{ consent_version }}" hidden>
    <h2 data-t="profTitle" class="mt-0"></h2>
    <div class="field-row"><span data-t="myDialect"></span>
      <div class="seg" role="radiogroup" data-dialect>
        <button type="button" role="radio" aria-checked="false" data-v="kmr" data-t="kmr">Kurmancî</button>
        <button type="button" role="radio" aria-checked="false" data-v="ckb" data-t="ckb">Soranî</button>
      </div></div>
    <div class="grid grid--3">
      <label class="field-row"><span data-t="gender"></span>
        <select class="field" id="gender"><option value="" data-t="none">—</option><option value="female" data-t="female"></option><option value="male" data-t="male"></option><option value="other" data-t="other"></option></select></label>
      <label class="field-row"><span data-t="age"></span>
        <select class="field" id="ageband"><option value="">—</option><option>18-29</option><option>30-44</option><option>45-59</option><option>60+</option></select></label>
      <label class="field-row"><span data-t="region"></span><input type="text" id="region" maxlength="60" /></label>
    </div>
    <label class="check"><input type="checkbox" id="consent" /> <span data-t="consent"></span></label>
    <div class="row mt-16"><button type="button" class="btn" id="startBtn" disabled data-t="start">Dest pê bike</button></div>
  </section>

  <section class="card mt-18" id="work" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-tab="record" data-t="tabRecord">Tomar bike</button>
      <button type="button" role="tab" aria-selected="false" data-tab="review" data-t="tabReview">Guhdarî bike</button>
    </div>
    <div id="panelRecord" role="tabpanel">
      <div class="sentence" id="sentence" aria-live="polite">…</div>
      <div class="stack-c">
        <button type="button" class="rec" id="rec" aria-pressed="false" data-t-aria="tabRecord">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
        </button>
        <div class="level" aria-hidden="true"><i></i></div>
        <span class="note" data-t="tapRecord"></span>
        <audio id="play" controls hidden></audio>
        <div class="row">
          <button type="button" class="btn btn--ghost" id="again" hidden data-t="again">Dîsa</button>
          <button type="button" class="btn" id="send" hidden data-t="send">Bişîne</button>
          <button type="button" class="btn btn--ghost" id="skip" data-t="skip">Derbas bike</button>
        </div>
        <p class="msg" id="rmsg" hidden></p>
        <span class="note">R · Enter · N</span>
      </div>
    </div>
    <div id="panelReview" role="tabpanel" hidden>
      <p class="note" data-t="reviewHow"></p>
      <p class="note" id="vempty" data-t="nothingToReview" hidden></p>
      <div id="vbox" hidden>
        <div class="sentence" id="vsentence"></div>
        <audio id="vaudio" controls class="audio-full mb-16"></audio>
        <div class="vote">
          <button type="button" class="btn" id="yes" data-t="matches">Rast e</button>
          <button type="button" class="btn btn--sor" id="no" data-t="noMatch">Ne rast e</button>
          <button type="button" class="btn btn--ghost" id="vskip" data-t="skip">Derbas bike</button>
        </div>
      </div>
    </div>
  </section>
</main>
{% include "_footer.html" %}
</body>
</html>

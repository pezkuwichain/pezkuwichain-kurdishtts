<!doctype html>
<html lang="kmr" dir="ltr">
<head>
{% include "_head.html" %}
<title>KurdishTTS — Dengê Kurdî</title>
<meta name="description" content="Nivîsa Kurmancî û Soranî bi deng bixwîne. Read Kurdish text aloud — and donate your voice to build a Kurdish voice made by the Kurdish nation." />
</head>
<body data-page="speak">
{% include "_header.html" %}
<main class="wrap">
  <section class="hero">
    <h1 data-t="speakTitle">Nivîsa Kurdî bi deng bixwîne</h1>
    <p data-t="speakLead"></p>
  </section>
  <section class="panel">
    {% include "_dialects.html" %}
    <div class="field-head"><label for="txt" data-t="yourText">Nivîsa te</label><span class="note" id="count"></span></div>
    <textarea id="txt" maxlength="600"></textarea>
    <button type="button" class="btn btn--block mt-16" id="go" data-t="read">Bixwîne</button>
    <audio id="out" controls hidden></audio>
    <p class="msg msg--bad" id="msg" hidden></p>
  </section>
  <a class="panel invite" href="/bexsh">
    <span><b data-t="inviteTitle"></b><span data-t="inviteText"></span></span>
    <span class="btn btn--ghost" data-t="navDonate">Dengê xwe bexşîne</span>
  </a>
</main>
{% include "_footer.html" %}
</body>
</html>

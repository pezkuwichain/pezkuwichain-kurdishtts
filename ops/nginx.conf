# kurdishtts.dks.news. The certificate is Let's Encrypt's, issued once with
#   certbot certonly --nginx -d kurdishtts.dks.news
# and renewed by certbot's timer; this file names its paths itself, so certbot
# never edits it (it put the TLS listener on the redirect block once: a loop).
limit_req_zone $binary_remote_addr zone=kt_tts:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=kt_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name kurdishtts.dks.news;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kurdishtts.dks.news;
    ssl_certificate /etc/letsencrypt/live/kurdishtts.dks.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kurdishtts.dks.news/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 7m;

    # The wallet bundles (kt-chain.js 842 kB, kt-wc.js 494 kB) went out
    # uncompressed: 1.3 MB before a sign-in QR code could appear (measured
    # 2026-10-06). Text is compressed here; audio, FLAC and fonts already are.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://asset-hub-rpc.pezkuwichain.io wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # /static/ is served by the app, not aliased here: nginx runs as www-data and
    # is deliberately unable to read /opt/kurdishtts, where the donated
    # recordings also live.
    location = /api/tts {
        limit_req zone=kt_tts burst=4 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kurdishtts-proxy.conf;
    }
    location /api/ {
        limit_req zone=kt_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kurdishtts-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/kurdishtts-proxy.conf;
    }
}
